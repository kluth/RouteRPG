name: Release (AAB für Google Play)
# Manuell starten (Actions > Release > Run workflow). Der Upload-Schlüssel liegt nur als GitHub-Secret, nie im Repo.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (Ganzzahl, bei jedem Upload höher)"
        required: true
      version_name:
        description: "versionName, z. B. 0.2.0"
        required: true
jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      KILO_KEYSTORE_PASSWORD: ${{ secrets.KILO_KEYSTORE_PASSWORD }}
      KILO_KEY_ALIAS: ${{ secrets.KILO_KEY_ALIAS }}
      KILO_KEY_PASSWORD: ${{ secrets.KILO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Schlüssel bereitstellen
        env:
          KILO_KEYSTORE_B64: ${{ secrets.KILO_KEYSTORE_B64 }}
        run: |
          test -n "$KILO_KEYSTORE_B64" || { echo "Secret KILO_KEYSTORE_B64 fehlt (siehe docs/release/PLAY_TEST.md)"; exit 1; }
          echo "$KILO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KILO_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Prüfen (Tests und Lint)
        run: ./gradlew :game-engine:test :nav-core:test :link-core:test :app:lintDebug :app:testDebugUnitTest
      - name: Signiertes Bundle bauen
        run: ./gradlew :app:bundleRelease -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: kiloquest-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
