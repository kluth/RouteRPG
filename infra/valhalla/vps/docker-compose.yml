# Produktiv-Stack fuer den VPS: Valhalla (nur intern) + Caddy (HTTPS + Token-Schutz).
services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    restart: unless-stopped
    volumes:
      - ./data:/custom_files
    environment:
      - tile_urls=${TILE_URLS}
      - use_tiles_ignore_pbf=True
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - server_threads=2
    expose:
      - "8002"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - API_TOKEN=${API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - valhalla

volumes:
  caddy_data:
